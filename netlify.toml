# Configuração da Netlify.
#
# Com este arquivo no repositório, a Netlify NÃO precisa de nenhum ajuste no
# painel: ela lê daqui o comando de build e a pasta a publicar. Se você tinha
# preenchido "Build command" ou "Publish directory" na mão, APAGUE os dois
# campos no painel (Site configuration → Build & deploy → Build settings),
# senão o que está no painel vence este arquivo.
#
# O site é exportado como HTML puro (`output: "export"` no next.config.ts),
# então não existe adaptador, função serverless nem runtime do Next no meio.
# É a pasta `out/` servida direto — foi o que resolveu o "Page not found".

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Cabeçalhos de segurança.
# Com export estático o `headers()` do next.config.ts não vale mais; a política
# passou a morar aqui. Se mexer na CSP, mexa também no vercel.json.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://graph.facebook.com; frame-src https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"

# Mídia: SEM "immutable".
#
# Aqui estava o erro que fazia o celular mostrar uma foto do boi diferente da
# do computador. Estes arquivos têm nome fixo (hero-direita.png e companhia),
# e eu os servia com cache de 1 ano marcado como "immutable" — que quer dizer
# "nem pergunte de novo". Quem tinha visitado o site antes da troca da foto
# ficava com a versão velha presa no navegador até 2027, sem jeito de
# atualizar nem recarregando.
#
# "must-revalidate" com max-age=0 faz o navegador perguntar "mudou?" a cada
# visita. Como a Netlify manda ETag, a resposta é um 304 de poucos bytes
# quando nada mudou: praticamente de graça, e a troca de qualquer imagem
# passa a valer na hora.
#
# O que PODE ser immutable é o que tem hash no nome, como /_next/static/*,
# porque ali o nome muda junto com o conteúdo.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Os bundles do Next já vêm com hash no nome.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
